[project]
name = "capital-generation"
version = "0.3.0"
description = "Unified financial data access for DeepSeek Harness (DSH): 同花顺 (THS) + AKShare fallback + Wind (later), with observable degradation chains"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "akshare>=1.15",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "servers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
