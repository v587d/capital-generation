# Tests run on both platforms. This repo was verified on Ubuntu only for a long time, and the
# Windows users paid for it: 8 failures reproduced on real Windows node were all the same class of
# posix assumptions (line endings, path separators, URL pathname as a file path, launching a Node
# CLI by command name). A Windows runner is really Windows — `;` PATH separator, .cmd shims for
# npm/dsh, backslash drive paths — so the assertions hold under both semantics.
#
# node 24 = the version measured on the user's Windows box (LTS); 26 = dev machine and the desktop
# bundle's line. Drop either and you get "CI green, real machine red".
name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One side failing must not cancel the other: both red = platform-independent problem,
      # one red = cross-platform defect.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['24', '26']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - name: 测试（含跨平台静态闸门）
        run: npm test

      # Line-ending gate: .gitattributes already stores text as LF, so this only catches someone
      # pushing CRLF blobs straight into the index (plumbing commands, hand-applied patches) —
      # there the attr column shows the rule while i/ still reads crlf.
      - name: 仓库里没有以 CRLF 入库的文本
        shell: bash
        run: |
          if git ls-files --eol | grep -q 'i/crlf'; then
            git ls-files --eol | grep 'i/crlf'
            echo '--- 上面这些文件要 git add --renormalize 一次 ---'
            exit 1
          fi

      # The ledger reads the installed dsh package dir, so only ubuntu installs dsh: surface drift
      # is OS-independent, and on Windows @deepseek-ai/dsh compiles native modules (node-pty,
      # koffi), which would mix upstream packaging failures into ours. The desktop harness lives in
      # app.asar where the probe finds no package dir, so Windows `npm test` reports that case
      # skipped rather than pass — a visible "not tested".
      - name: 装 dsh（只为接口账本）
        if: matrix.os == 'ubuntu-latest'
        run: npm install -g @deepseek-ai/dsh@0.2.1-rc.5   # same version as the README baseline badge; bump them together

      - name: DSH 扩展面账本
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:dsh
